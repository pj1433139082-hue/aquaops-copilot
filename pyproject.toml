[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aquaops-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "langgraph>=0.2,<1",
  "qdrant-client>=1.18,<1.19",
  "sentence-transformers>=3.0,<4",
  "rank-bm25>=0.2,<1",
  "mcp>=1.27,<2",
  "xlrd>=2.0,<3",
  "duckdb>=1.1,<2",
  "pyarrow>=18,<20",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "redis>=5,<6",
  "celery>=5.4,<6",
]

[project.optional-dependencies]
public-openvino = [
  "openvino==2026.3.0",
  "optimum==2.1.0",
  "optimum-intel==1.27.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "xlwt>=1.3,<2"]

[tool.hatch.build.targets.wheel]
only-include = [
  "src/aquaops/__init__.py",
  "src/aquaops/config.py",
  "src/aquaops/demo.py",
  "src/aquaops/demo_delivery.py",
  "src/aquaops/public_demo_cli.py",
  "src/aquaops/agent",
  "src/aquaops/api",
  "src/aquaops/cache",
  "src/aquaops/data",
  "src/aquaops/db",
  "src/aquaops/domain",
  "src/aquaops/forecasting",
  "src/aquaops/mcp",
  "src/aquaops/observability",
  "src/aquaops/rag",
  "src/aquaops/research",
  "src/aquaops/security",
  "src/aquaops/tasks",
]
sources = ["src"]

[tool.ruff]
respect-gitignore = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
